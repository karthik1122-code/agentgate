<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGate dashboard</title>
<meta name="description" content="Review the agent actions your policy held, and see everything the gate decided.">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='1' width='14' height='30' rx='4' fill='%23111'/%3E%3Ccircle cx='16' cy='8' r='3.2' fill='%23ff5443'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23ffd21f'/%3E%3Ccircle cx='16' cy='24' r='3.2' fill='%2335d682'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
</head>
<body class="app">
<div id="toast" role="status" aria-live="polite"></div>
<div id="auth" hidden></div>
<div id="app" hidden>
  <aside class="rail">
    <a class="brand" href="/" aria-label="AgentGate website"><span class="mark" aria-hidden="true"></span><span class="word">AgentGate</span></a>
    <button class="search" id="openpal" type="button" aria-label="Open command menu"></button>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="railfoot"><div class="sys" id="sys"></div><div class="who" id="who"></div></div>
  </aside>
  <div class="col"><header class="topbar" id="topbar"></header><main id="view" tabindex="-1"></main><footer class="statusbar" id="status"></footer></div>
</div>
<div id="pal" role="dialog" aria-modal="true" aria-label="Command menu"><div class="pbox"><input id="pin" placeholder="Go to a page or run a command" aria-label="Command" autocomplete="off"><ul id="pls" role="listbox"></ul></div></div>
<script src="/app.js" type="module"></script>
</body>
</html>
