services:
  - type: web
    name: agentgate
    runtime: node
    plan: free
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      # Required in practice: the first account becomes the administrator, so set this before the URL is public.
      - key: SETUP_TOKEN
        sync: false
